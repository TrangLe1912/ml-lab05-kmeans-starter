name: Lab 05 Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          python scripts/download_data.py

      - name: Check repository and notebook structure
        run: |
          python tests/check_lab05.py

      - name: Run K-Means from-scratch unit tests
        run: |
          python -m pytest -q tests/test_kmeans_manual.py

      - name: Execute notebook
        run: |
          jupyter nbconvert             --to notebook             --execute Lab05_KMeans.ipynb             --output executed_Lab05_KMeans.ipynb             --ExecutePreprocessor.timeout=300
